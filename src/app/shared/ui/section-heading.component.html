<div class="flex items-center gap-4" [class.justify-center]="align() === 'center'">
  <span class="font-mono text-[11px] tracking-[0.2em]" [class]="cls().index">
    {{ index() }} / {{ total() }}
  </span>
  <span class="h-px w-10" [class]="cls().rule"></span>
  <span class="font-mono text-[11px] font-medium uppercase tracking-[0.22em]" [class]="cls().eyebrow">{{ eyebrow() }}</span>
</div>
<h2 class="section-title mt-5" [class.mx-auto]="align() === 'center'" [class.text-center]="align() === 'center'"
    [class]="cls().title" [style.max-width]="maxWidth()">
  <ng-content select="[title]" />
</h2>
<div class="mt-4 text-base leading-relaxed sm:text-lg" [class.mx-auto]="align() === 'center'" [class.text-center]="align() === 'center'"
     [class]="cls().subtitle" [style.max-width]="'40rem'">
  <ng-content select="[subtitle]" />
</div>
